<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>궤도 점프</title>
<meta name="description" content="탭 한 번으로 즐기는 궤도 서바이벌 게임">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🪐%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f4f1ea;--fg:#23212b;--ring:#c9c3d6;--player:#5b4bdb;--coin:#f0a500;--bomb:#e5484d;--sub:#6d6a78;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15141c;--fg:#f1eefc;--ring:#3a3750;--player:#8f83ff;--coin:#ffc53d;--bomb:#ff6369;--sub:#a09cb5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15141c;--fg:#f1eefc;--ring:#3a3750;--player:#8f83ff;--coin:#ffc53d;--bomb:#ff6369;--sub:#a09cb5;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#wrap{position:relative;height:100%}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;text-align:center;pointer-events:none}
#score{font-size:56px;font-weight:700;line-height:1}
#best{font-size:14px;color:var(--sub);margin-top:4px}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .4s ease}
#msg:empty{display:none}
.card{text-align:center;max-width:320px;width:100%}
.orb{width:92px;height:92px;margin:0 auto 22px;border:6px solid var(--ring);border-radius:50%;position:relative;animation:spin 2.4s linear infinite}
.orb i{position:absolute;top:-13px;left:50%;margin-left:-10px;width:20px;height:20px;border-radius:50%;background:var(--player)}
.orb b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--coin);font-size:30px;animation:spin 2.4s linear infinite reverse}
h1{font-size:42px;margin:0 0 6px;letter-spacing:-1px}
.tag{color:var(--sub);font-size:15px;margin:0}
.how{display:flex;gap:10px;margin:24px 0}
.how div{flex:1;padding:12px 6px;border-radius:14px;background:color-mix(in srgb,var(--ring) 40%,transparent);font-size:13px;color:var(--sub);line-height:1.4}
.how span{display:block;font-size:24px;margin-bottom:4px}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:16px;background:var(--player);color:#fff;font-size:18px;font-weight:700;font-family:inherit;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.sec{background:transparent;color:var(--fg);border:2px solid var(--ring);margin-top:10px;font-size:16px;padding:13px}
.hi{margin-top:16px;color:var(--sub);font-size:14px}
.lbl{color:var(--sub);font-size:14px;letter-spacing:2px}
.big{font-size:88px;font-weight:800;line-height:1;margin:6px 0 14px}
.badge{display:inline-block;background:var(--coin);color:#23212b;font-weight:700;padding:5px 14px;border-radius:99px;font-size:14px;margin-bottom:10px;animation:pop .6s ease}
.over h1{font-size:30px;margin-bottom:18px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="hud"><div id="score">0</div><div id="best"></div></div>
<div id="msg"></div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),msg=document.getElementById('msg');
let W,H,R,cx,cy,dpr=1;
function resize(){dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);cx=W/2;cy=H/2;R=Math.min(W,H)*0.34}
window.addEventListener('resize',resize);resize();

let best=0;try{best=+localStorage.getItem('orbit-best')||0}catch(e){}
let state='ready',a,dir,speed,items,score,spawnT,t,pops,shake;

function reset(){a=-Math.PI/2;dir=1;speed=2.2;items=[];score=0;spawnT=0.5;t=0;pops=[];shake=0;scoreEl.textContent='0';}
function showMsg(){
 document.getElementById('hud').style.display=state==='play'?'block':'none';
 if(state==='ready')msg.innerHTML='<div class="card"><div class="orb"><i></i><b>★</b></div><h1>궤도 점프</h1><p class="tag">탭 한 번으로 즐기는 궤도 서바이벌</p><div class="how"><div><span>👆</span>탭하면<br>방향 전환</div><div><span>⭐</span>별을 먹고<br>점수 획득</div><div><span>💣</span>폭탄은<br>피하기</div></div><button class="btn" data-act="start">게임 시작</button><div class="hi">'+(best?'🏆 최고 기록 '+best:'스페이스바 / Enter로도 시작')+'</div></div>';
 else if(state==='over')msg.innerHTML='<div class="card over"><h1>게임 오버</h1>'+(isNew?'<div class="badge">🎉 신기록!</div>':'')+'<div class="lbl">SCORE</div><div class="big">'+score+'</div><div class="hi" style="margin:0 0 22px">🏆 최고 기록 '+best+'</div><button class="btn" data-act="start">다시 도전</button><button class="btn sec" data-act="home">처음 화면으로</button></div>';
 else msg.innerHTML='';
 bestEl.textContent=best?'최고 '+best:'';
}
function angDist(x,y){let d=Math.abs(x-y)%(Math.PI*2);return d>Math.PI?Math.PI*2-d:d}
function spawn(){
 const bombP=Math.min(0.6,0.35+score*0.01);
 const type=Math.random()<bombP?'bomb':'coin';
 let ang,tries=0;
 do{ang=Math.random()*Math.PI*2;tries++}while(tries<10&&angDist(ang,a)<0.9);
 items.push({ang,type,age:0,warn:type==='bomb'?0.7:0,life:type==='bomb'?4:5});
}
function start(){state='play';reset();showMsg()}
function flip(){if(state==='play')dir*=-1}
let t_over=0,isNew=false;
function die(){
 state='over';t_over=0;shake=14;
 isNew=score>best&&score>0;
 if(score>best){best=score;try{localStorage.setItem('orbit-best',best)}catch(e){}}
 showMsg();
}
function press(e){e.preventDefault();flip()}
msg.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(state==='over'&&t_over<0.5)return;if(b.dataset.act==='start')start();else{state='ready';reset();showMsg()}});
cv.addEventListener('pointerdown',press);
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.key===' '||e.key==='Enter'){e.preventDefault();if(state==='play')flip();else if(state==='ready'||t_over>0.5)start()}});

function update(dt){
 if(state==='over'){t_over+=dt}
 if(state!=='play')return;
 t+=dt;a+=dir*speed*dt;
 spawnT-=dt;
 if(spawnT<=0){spawn();spawnT=Math.max(0.55,1.1-score*0.015)}
 for(const it of items){
  it.age+=dt;
  if(it.dead)continue;
  const active=it.type==='coin'||it.age>=it.warn;
  if(active&&angDist(it.ang,a)<0.16){
   if(it.type==='coin'){score++;speed=Math.min(4.6,speed+0.05);it.dead=true;scoreEl.textContent=score;
    const px=cx+Math.cos(it.ang)*R,py=cy+Math.sin(it.ang)*R;pops.push({x:px,y:py,r:10,o:1})}
   else{die();return}
  }
 }
 items=items.filter(it=>!it.dead&&it.age<it.life);
}
function draw(){
 const s=getComputedStyle(document.documentElement);
 const C=n=>s.getPropertyValue(n).trim();
 ctx.clearRect(0,0,W,H);
 ctx.save();
 if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=0.85;if(shake<0.5)shake=0}
 ctx.lineWidth=6;ctx.strokeStyle=C('--ring');
 ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();
 ctx.textAlign='center';ctx.textBaseline='middle';
 for(const it of items){
  const x=cx+Math.cos(it.ang)*R,y=cy+Math.sin(it.ang)*R;
  if(it.type==='coin'){
   const pulse=1+Math.sin(it.age*8)*0.08;
   ctx.fillStyle=C('--coin');ctx.font=(26*pulse)+'px sans-serif';ctx.fillText('★',x,y+1);
  }else{
   const warning=it.age<it.warn;
   ctx.globalAlpha=warning?(Math.sin(it.age*30)>0?0.7:0.15):(it.life-it.age<0.5?0.4:1);
   ctx.fillStyle=C('--bomb');
   ctx.beginPath();ctx.arc(x,y,warning?9:13,0,Math.PI*2);ctx.fill();
   if(!warning){ctx.strokeStyle=C('--bomb');ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,19,0,Math.PI*2);ctx.stroke();ctx.lineWidth=6}
   ctx.globalAlpha=1;
  }
 }
 for(const p of pops){ctx.globalAlpha=p.o;ctx.strokeStyle=C('--coin');ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.stroke();p.r+=1.6;p.o-=0.045}
 ctx.globalAlpha=1;pops=pops.filter(p=>p.o>0);
 // player trail + ball
 const px=cx+Math.cos(a)*R,py=cy+Math.sin(a)*R;
 for(let i=1;i<=6;i++){
  const ta=a-dir*i*0.07*(speed/2.2);
  ctx.globalAlpha=0.35-i*0.05;ctx.fillStyle=C('--player');
  ctx.beginPath();ctx.arc(cx+Math.cos(ta)*R,cy+Math.sin(ta)*R,13-i,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;ctx.fillStyle=C('--player');
 ctx.beginPath();ctx.arc(px,py,13,0,Math.PI*2);ctx.fill();
 ctx.restore();
}
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
reset();showMsg();requestAnimationFrame(loop);
</script>
</body>
</html>
